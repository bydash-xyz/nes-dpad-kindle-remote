; Kindle page-turner protocol test harness for a spare ESP32-S3.
; Validates VID/PID acceptance, keycodes, sleep and battery reporting
; before the XIAO nRF52840 + ZMK build.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; Uncomment if your board's serial monitor is on the native USB port
    ; (no separate UART/USB bridge chip), e.g. most compact S3 boards:
    ; -DARDUINO_USB_CDC_ON_BOOT=1
