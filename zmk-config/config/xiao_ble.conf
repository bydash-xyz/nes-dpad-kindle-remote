# Kindle remote identity (validated on ESP32-S3, FINDINGS.md 4.1)
CONFIG_ZMK_KEYBOARD_NAME="Amazon Kindle Remote"
CONFIG_ZMK_BLE_KINDLE_REMOTE_ADV=y
CONFIG_BT_DIS_PNP_VID_SRC=1
CONFIG_BT_DIS_PNP_VID=0x0171
CONFIG_BT_DIS_PNP_PID=0x0443
CONFIG_BT_DIS_PNP_VER=0x0100
CONFIG_BT_DIS_MANUF_NAME_STR="Amazon"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Kindle Remote"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.0.0"
CONFIG_ZMK_BATTERY_REPORTING=y

# BLE only. With USB HID on, keys go to the USB host while plugged in.
CONFIG_ZMK_USB=n

# Kindle fixes the interval at 20 ms but accepts latency and timeout
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=16
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=16
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Stay connected; no deep sleep
CONFIG_ZMK_SLEEP=n
