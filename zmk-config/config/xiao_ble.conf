# Kindle remote identity (validated on ESP32-S3, FINDINGS.md 4.1)
CONFIG_ZMK_KEYBOARD_NAME="Amazon Kindle Remote"
CONFIG_ZMK_BLE_KINDLE_REMOTE_ADV=y
CONFIG_BT_DIS_PNP_VID_SRC=1
CONFIG_BT_DIS_PNP_VID=0x0171
CONFIG_BT_DIS_PNP_PID=0x0443
CONFIG_BT_DIS_PNP_VER=0x0100
CONFIG_BT_DIS_MANUF_NAME_STR="Amazon"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Kindle Remote"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.0.0"
CONFIG_ZMK_BATTERY_REPORTING=y

# Let the bonded Kindle pair again after it forgets the remote. Without this, ZMK rejects
# pairing ("taken profile") until the bond is cleared (hold D_UP + D_RIGHT 5 s, keymap).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# BLE only. With USB HID on, keys go to the USB host while plugged in.
CONFIG_ZMK_USB=n

# Kindle fixes the interval at 20 ms but accepts latency and timeout.
# Latency 99 = idle radio event every 2 s; timeout (8 s) must exceed 2 x (1 + 99) x 20 ms = 4 s.
# Key presses are not delayed: the remote may transmit at any 20 ms event.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=16
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=16
CONFIG_BT_PERIPHERAL_PREF_LATENCY=99
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800

# Stay connected while in use; deep sleep after 60 min idle. The waking press is lost
# (the chip resets) and reconnecting takes ~0.3-3 s.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Keep the onboard QSPI flash (P25Q16H, unused by ZMK) in deep power-down while idle
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
# Runtime PM turns this off by default, but ZMK deep sleep needs it to suspend devices
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y


# Low Power optimizations
CONFIG_NFCT_PINS_AS_GPIOS=y
